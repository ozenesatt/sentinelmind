name: SentinelMind CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile critical modules
        run: |
          python -m py_compile api/main.py
          python -m py_compile engine/ai_action_bridge.py
          python -m py_compile actions/remediate.py
          python -m py_compile hitl/web_app.py

      - name: Run tests
        run: python -m pytest -q -m "not integration"
